# Fork-only workflow (metaer/TrustTunnelFlutterClient): checks the code and builds sideloadable
# Android APKs on GitHub-hosted runners. The upstream workflows rely on AdGuard self-hosted runners,
# a private container registry and Vault, so they cannot run in a fork. See FORK.md.
name: Fork - Build Android APK

on:
  push:
    branches: [split-tunnel]
    tags: ['v*-split.*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub pre-release with the APKs attached
        type: boolean
        default: false
      tag:
        description: Release tag (for example v1.2.0-split.3). Empty = v<computed version>
        type: string
        default: ''
      lib-version:
        description: Override the client library version for this run (for example 1.1.5-rc.6-split.2)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Upstream app version the fork is based on; bump after rebasing onto a new upstream release.
  TT_APP_BASE_VERSION: '1.2.0'
  # Keeps versionCode increasing if run numbers ever restart (for example after renaming this file).
  TT_BUILD_NUMBER_OFFSET: '0'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  check:
    name: Format, analyze, test
    # Never run in the upstream repository if this file ends up in an upstream branch.
    if: github.repository_owner != 'TrustTunnel'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Same order as the upstream lint workflow: check committed sources before code generation.
      - name: Check formatting
        run: dart format -o none --set-exit-if-changed .

      - name: Generate code (drift, localization, pigeon)
        run: make init

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Install SQLite for database tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libsqlite3-dev

      - name: Test
        run: flutter test --no-pub

  build-apk:
    name: Build release APKs
    needs: [check]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # only used by the optional release step
    steps:
      - uses: actions/checkout@v5

      - name: Fail fast without GPR_KEY
        env:
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          if [ -z "$GPR_KEY" ]; then
            echo "::error::Secret GPR_KEY (classic token with read:packages) is required to download the client library. See FORK.md."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" "ndk;29.0.14206865" > /dev/null

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v || true

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          else
            BUILD_NAME="${TT_APP_BASE_VERSION}-split.ci.${GITHUB_RUN_NUMBER}"
          fi
          BUILD_NUMBER=$(( TT_BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER ))
          echo "build-name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build-number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "APK version: $BUILD_NAME ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

      - name: Override the client library version
        if: github.event_name == 'workflow_dispatch' && inputs.lib-version != ''
        env:
          LIB_VERSION: ${{ inputs.lib-version }}
        run: echo "ORG_GRADLE_PROJECT_ttLibVersion=$LIB_VERSION" >> "$GITHUB_ENV"

      # Mirrors the upstream signing setup with repository secrets instead of Vault, and falls back
      # to a throwaway key so that the workflow also works before the secrets are configured.
      # The values go to a file that only the build steps load, not to the job environment.
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYSTORE="$RUNNER_TEMP/trusttunnel.keystore"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            : "${KEYSTORE_PASSWORD:?secret KEYSTORE_PASSWORD is required together with KEYSTORE_BASE64}"
            KEY_ALIAS="${KEY_ALIAS:-trusttunnel}"
            KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "Signing with the keystore from repository secrets (alias: $KEY_ALIAS)"
          else
            KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS="trusttunnel"
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -sigalg SHA256withRSA \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=TrustTunnel fork ephemeral key" > /dev/null
            echo "::warning title=Throwaway signing key::KEYSTORE_BASE64 is not set. This APK cannot be installed over a previous build; uninstall first (server list and settings are lost) or add the signing secrets described in FORK.md."
            echo "### Throwaway signing key" >> "$GITHUB_STEP_SUMMARY"
            echo "This APK is signed with a key generated for this run only, so it cannot update an installed build. Add the signing secrets described in FORK.md." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            printf 'export ORG_GRADLE_PROJECT_signingConfigKeyStorePath=%q\n' "$KEYSTORE"
            printf 'export ORG_GRADLE_PROJECT_signingConfigKeyStorePassword=%q\n' "$KEYSTORE_PASSWORD"
            printf 'export ORG_GRADLE_PROJECT_signingConfigKeyAlias=%q\n' "$KEY_ALIAS"
            printf 'export ORG_GRADLE_PROJECT_signingConfigKeyPassword=%q\n' "$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing.env"

      - name: Generate code (drift, localization, pigeon)
        run: make init

      - name: Precache Flutter Android artifacts
        run: flutter precache --android

      - name: Build universal APK
        env:
          GPR_KEY: ${{ secrets.GPR_KEY }}
          BUILD_NAME: ${{ steps.version.outputs.build-name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/signing.env"
          flutter build apk --release --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --no-pub
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/trusttunnel-split-${BUILD_NAME}-universal.apk"

      # Tool output goes to files first: `producer | grep -q` fails under pipefail when grep exits
      # early and the producer gets SIGPIPE.
      - name: Verify APK
        env:
          BUILD_NAME: ${{ steps.version.outputs.build-name }}
        run: |
          set -euo pipefail
          APK="dist/trusttunnel-split-${BUILD_NAME}-universal.apk"
          WORK="$RUNNER_TEMP/apk-check"
          mkdir -p "$WORK"
          EXPECTED_ID="$(sed -n 's/^ttAppId=//p' android/gradle.properties)"

          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" > "$WORK/badging.txt"
          grep -E "^package:|^application-label:" "$WORK/badging.txt"
          grep -q "package: name='${EXPECTED_ID}'" "$WORK/badging.txt" \
            || { echo "::error::applicationId is not ${EXPECTED_ID}"; exit 1; }

          unzip -l "$APK" > "$WORK/files.txt"
          grep -q 'lib/arm64-v8a/libtrusttunnel_android.so' "$WORK/files.txt" \
            || { echo "::error::the native client library is missing from the APK"; exit 1; }

          unzip -p "$APK" 'classes*.dex' > "$WORK/classes.dex"
          grep -a -q 'Lcom/adguard/trusttunnel/SplitTunnelRules;' "$WORK/classes.dex" \
            || { echo "::error::the client library in the APK has no split tunneling support"; exit 1; }

          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > "$WORK/AndroidManifest.xml"
          python3 - "$WORK/AndroidManifest.xml" <<'PY' \
            || { echo "::error::the manifest does not declare launcher apps in <queries>"; exit 1; }
          import sys
          import xml.etree.ElementTree as ET

          name = '{http://schemas.android.com/apk/res/android}name'
          root = ET.parse(sys.argv[1]).getroot()
          sys.exit(0 if any(
              category.get(name) == 'android.intent.category.LAUNCHER'
              for queries in root.iter('queries')
              for intent in queries.iter('intent')
              for category in intent.iter('category')
          ) else 1)
          PY

          ls ~/.gradle/caches/modules-2/files-2.1/com.adguard.trusttunnel/trusttunnel-client-android/

      - name: Build arm64 APK
        env:
          GPR_KEY: ${{ secrets.GPR_KEY }}
          BUILD_NAME: ${{ steps.version.outputs.build-name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/signing.env"
          flutter build apk --release --target-platform android-arm64 \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk "dist/trusttunnel-split-${BUILD_NAME}-arm64.apk"
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: trusttunnel-split-apk-${{ steps.version.outputs.build-name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub pre-release
        if: >-
          (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-split.')) ||
          (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.tag != '' && inputs.tag || format('v{0}', steps.version.outputs.build-name)) }}
          name: TrustTunnel split tunneling ${{ steps.version.outputs.build-name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.apk
