def getGprProp = { String name ->
    def v = project.findProperty(name)
    if (v != null) return v.toString()

    // fallback to env
    def envName = name.replace('.', '_').toUpperCase()   // gpr.key -> GPR_KEY
    v = System.getenv(envName)
    if (v != null && !v.toString().trim().isEmpty()) return v.toString()

    return null
}

// Maven repository with the TrustTunnel client library (com.adguard.trusttunnel:trusttunnel-client-android).
// Override with the `ttLibRepoUrl` Gradle property: android/gradle.properties, -P or ORG_GRADLE_PROJECT_ttLibRepoUrl.
def ttLibRepoUrl = (project.findProperty("ttLibRepoUrl") ?: "https://maven.pkg.github.com/TrustTunnel/TrustTunnelClient").toString()

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri(ttLibRepoUrl)
            credentials {
                username = ""
                password = getGprProp("gpr.key")
            }
            authentication { basic(BasicAuthentication) }
            // GitHub Packages only hosts the client library; never ask it for anything else.
            content { includeGroup("com.adguard.trusttunnel") }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
