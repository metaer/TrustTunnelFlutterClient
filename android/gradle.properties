org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# --- metaer fork (split tunneling build); fork-only, keep out of upstream pull requests ---
# Installs next to the official app under its own id and launcher label.
ttAppId=com.adguard.trusttunnel.split
ttAppLabel=TTm
# Client library with split tunneling, published by metaer/TrustTunnelClient (tag android-lib/v<version>).
ttLibRepoUrl=https://maven.pkg.github.com/metaer/TrustTunnelClient
ttLibVersion=1.1.5-rc.6-split.1
